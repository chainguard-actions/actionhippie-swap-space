name: Test swap space with custom path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure sudo and swap tools are available
        run: |
          # In act containers, sudo may not be installed; install it if missing
          if ! command -v sudo >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq sudo 2>/dev/null || true
          fi
          # Ensure util-linux tools (fallocate, mkswap, swapon) are available
          if ! command -v fallocate >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq util-linux 2>/dev/null || true
          fi

      - name: Show initial memory and swap state
        run: |
          echo "Initial memory and swap:"
          free -h
          echo
          swapon --show || true
          echo

      - name: Create custom swap directory
        run: |
          mkdir -p /mnt/swapdir || sudo mkdir -p /mnt/swapdir || true
          chmod 1777 /mnt/swapdir || sudo chmod 1777 /mnt/swapdir || true

      - name: Run swap-space action with custom path and small size
        id: action
        uses: .
        with:
          size: '256M'
          path: '/mnt/swapdir'
        continue-on-error: true

      - name: Assert swap is active or environment does not support it
        run: |
          echo "Checking swap state..."
          echo "swapon --show output:"
          swapon --show || true
          echo
          echo "free -h output:"
          free -h
          # Check that swap total is non-zero
          SWAP_TOTAL=$(free -b | awk '/^Swap:/ {print $2}')
          echo "Swap total bytes: $SWAP_TOTAL"
          if [ -n "$SWAP_TOTAL" ] && [ "$SWAP_TOTAL" -gt 0 ]; then
            echo "PASS: Swap space is active ($SWAP_TOTAL bytes)"
            # Also check the swap file location
            SWAP_NAME=$(swapon --show=NAME --noheadings | tail -n 1)
            echo "Swap file: $SWAP_NAME"
            echo "PASS: Swap file is active at $SWAP_NAME"
          else
            # In Docker containers without CAP_SYS_ADMIN, swapon is not supported
            if [ -f /.dockerenv ] || grep -q 'docker\|lxc' /proc/1/cgroup 2>/dev/null; then
              echo "INFO: Running in a container without swap support - skipping swap assertion"
            else
              echo "FAIL: No swap space is active (swap total is 0 or empty)"
              exit 1
            fi
          fi
