name: Test custom swap size
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check if swap operations are supported in this environment
        id: swap-check
        run: |
          echo "Memory and swap before action:"
          free -h || true
          swapon --show || true
          # Check if we can create swap (requires kernel support and privileges)
          if sudo fallocate -l 1M /tmp/test-swap-check 2>/dev/null && \
             sudo chmod 600 /tmp/test-swap-check 2>/dev/null && \
             sudo mkswap /tmp/test-swap-check 2>/dev/null && \
             sudo swapon /tmp/test-swap-check 2>/dev/null; then
            sudo swapoff /tmp/test-swap-check 2>/dev/null || true
            sudo rm -f /tmp/test-swap-check 2>/dev/null || true
            echo "swap_supported=true" >> $GITHUB_OUTPUT
            echo "Swap operations are supported in this environment"
          else
            sudo rm -f /tmp/test-swap-check 2>/dev/null || true
            echo "swap_supported=false" >> $GITHUB_OUTPUT
            echo "Swap operations are NOT supported in this environment (container limitation)"
          fi

      - name: Run swap-space action with custom size
        if: steps.swap-check.outputs.swap_supported == 'true'
        uses: .
        with:
          size: 512M

      - name: Assert swap is active
        if: steps.swap-check.outputs.swap_supported == 'true'
        run: |
          echo "Swap after action:"
          swapon --show || true
          COUNT=$(swapon --show=NAME --noheadings 2>/dev/null | wc -l)
          echo "Active swap entries: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "FAIL: expected at least one active swap entry"
            exit 1
          fi
          echo "PASS: swap is active"

      - name: Assert swapfile size is approximately 512M
        if: steps.swap-check.outputs.swap_supported == 'true'
        run: |
          SIZE=$(stat -c%s /swapfile 2>/dev/null || echo 0)
          echo "Swapfile size in bytes: $SIZE"
          # 512M = 536870912 bytes
          EXPECTED=536870912
          if [ "$SIZE" -ne "$EXPECTED" ]; then
            echo "FAIL: expected swapfile size $EXPECTED bytes but got $SIZE"
            exit 1
          fi
          echo "PASS: swapfile is 512M"

      - name: Skip notice when swap not supported
        if: steps.swap-check.outputs.swap_supported != 'true'
        run: |
          echo "SKIP: swap operations not supported in this container environment"
          echo "This is expected when running under act without --privileged flag"
          echo "PASS: test skipped gracefully"
