name: Test custom swap path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare swap environment
        run: |
          # In act containers we run as root; create a sudo passthrough if needed
          if ! command -v sudo > /dev/null 2>&1; then
            printf '#!/bin/sh\nexec "$@"\n' > /usr/local/bin/sudo
            chmod +x /usr/local/bin/sudo
          fi

          # Disable existing swap to start fresh (best effort)
          swapoff -a 2>/dev/null || true

          # Test if swapon actually works in this container
          SWAP_WORKS=false
          if fallocate -l 4M /tmp/test_swap_check 2>/dev/null || dd if=/dev/zero of=/tmp/test_swap_check bs=1M count=4 2>/dev/null; then
            if mkswap /tmp/test_swap_check > /dev/null 2>&1; then
              if swapon /tmp/test_swap_check > /dev/null 2>&1; then
                SWAP_WORKS=true
                swapoff /tmp/test_swap_check 2>/dev/null || true
              fi
            fi
            rm -f /tmp/test_swap_check
          fi

          echo "Swap works natively: $SWAP_WORKS"

          if [ "$SWAP_WORKS" = "false" ]; then
            echo "Installing swap command shims for container environment..."

            printf '#!/bin/sh\nSWAPS_FILE=/tmp/active_swaps_list\ncase "$1" in\n  --show*)\n    cat "$SWAPS_FILE" 2>/dev/null || true\n    exit 0\n    ;;\n  -a)\n    exit 0\n    ;;\n  *)\n    echo "$1" >> "$SWAPS_FILE"\n    exit 0\n    ;;\nesac\n' > /usr/local/bin/swapon
            chmod +x /usr/local/bin/swapon

            printf '#!/bin/sh\nSWAPS_FILE=/tmp/active_swaps_list\ncase "$1" in\n  -a)\n    rm -f "$SWAPS_FILE"\n    exit 0\n    ;;\n  *)\n    if [ -f "$SWAPS_FILE" ]; then\n      grep -v "^$1$" "$SWAPS_FILE" > "$SWAPS_FILE.tmp" 2>/dev/null || true\n      mv "$SWAPS_FILE.tmp" "$SWAPS_FILE" 2>/dev/null || true\n    fi\n    exit 0\n    ;;\nesac\n' > /usr/local/bin/swapoff
            chmod +x /usr/local/bin/swapoff

            printf '#!/bin/sh\nexit 0\n' > /usr/local/bin/mkswap
            chmod +x /usr/local/bin/mkswap
          fi

          # Clear any recorded swaps
          rm -f /tmp/active_swaps_list

          echo "Disk space:"
          df -h /
          echo "Current swap:"
          free -h

      - name: Run swap-space action with custom path
        uses: .
        with:
          size: '64M'
          path: '/var/myswapfile'

      - name: Assert swapfile was created at custom path
        run: |
          echo "Checking swapfile exists at /var/myswapfile..."
          if [ ! -f /var/myswapfile ]; then
            echo "FAIL: Swapfile not found at /var/myswapfile"
            exit 1
          fi
          echo "PASS: Swapfile exists at /var/myswapfile"
          ls -lh /var/myswapfile

      - name: Assert swap is active at custom path
        run: |
          echo "Checking swap is active at /var/myswapfile..."
          swapon --show || true
          SWAP_ACTIVE=$(swapon --show=NAME 2>/dev/null | grep '/var/myswapfile' || true)
          echo "Active swap at custom path: $SWAP_ACTIVE"
          if [ -z "$SWAP_ACTIVE" ]; then
            echo "FAIL: No active swap found at /var/myswapfile"
            exit 1
          fi
          echo "PASS: Swap is active at /var/myswapfile"
