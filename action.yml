name: 'swap-space'
description: 'Resize or create swap space'
author: 'actionhippie'
inputs:
  size:
    description: |
      Swap size in fallocate format, defaults to `10G`
    required: false
    default: '10G'
  path:
    description: |
      Swap path if no swap exists, defaults to `/tmp`
    required: false
    default: '/tmp'
runs:
  using: 'composite'
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Swap space before modification
      shell: bash
      run: |
        echo "Memory and swap:"
        free -h
        echo
        swapon --show
        echo
    - name: Create or resize swap space
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_SIZE: ${{ inputs.size }}
      run: |
        export SWAP_FILE=$(swapon --show=NAME | tail -n 1)

        if test -z "${SWAP_FILE}"; then
            export SWAP_FILE=$(sudo mktemp "${INPUT_PATH}/swap.XXXXXXXXXX")
        else
            sudo swapoff "${SWAP_FILE}"
            sudo rm "${SWAP_FILE}"
        fi

        sudo fallocate -l "${INPUT_SIZE}" "${SWAP_FILE}"

        sudo chmod 600 "${SWAP_FILE}"
        sudo mkswap "${SWAP_FILE}"
        sudo swapon "${SWAP_FILE}"
    - name: Swap space after modification
      shell: bash
      run: |
        echo "Memory and swap:"
        free -h
        echo
        swapon --show
        echo
