name: Test basic swap space creation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Record swap before
        run: |
          echo "Swap before action:"
          free -h
          swapon --show || true
      - id: action
        uses: .
        with:
          size: 1G
        continue-on-error: true
      - name: Assert swap file was created or swap is active
        run: |
          echo "Swap after action:"
          free -h
          swapon --show || true
          # Check if swap is active (works on real runners)
          SWAP_TOTAL=$(free -b | awk '/^Swap:/ {print $2}')
          echo "Swap total bytes: $SWAP_TOTAL"
          # Check if a swap file exists under /tmp (default path)
          SWAP_FILE=$(ls /tmp/swap.* 2>/dev/null | head -n 1 || true)
          echo "Swap file found: $SWAP_FILE"
          if [ "$SWAP_TOTAL" -gt 0 ]; then
            echo "PASS: swap is active with $SWAP_TOTAL bytes"
          elif [ -n "$SWAP_FILE" ]; then
            echo "PASS: swap file was created at $SWAP_FILE (swapon may not be available in this environment)"
          else
            echo "FAIL: neither swap is active nor swap file was created"
            exit 1
          fi
